name: Deploy BillieJob

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: billiejob-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4

      - name: Install dependencies and build on GitHub Actions
        run: |
          npm ci
          npx prisma generate
          NODE_OPTIONS=--max-old-space-size=4096 npm run build -- --webpack

      - name: Package application and prebuilt output
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dev.db --exclude=.env.local -czf /tmp/billiejob-deploy.tar.gz .
          mv /tmp/billiejob-deploy.tar.gz billiejob-deploy.tar.gz

      - name: Upload application package
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: billiejob-deploy.tar.gz
          target: /tmp

      - name: Build and restart on Lighthouse
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/BillieJob
            tar -xzf /tmp/billiejob-deploy.tar.gz -C /var/www/BillieJob
            rm -f /tmp/billiejob-deploy.tar.gz
            rm -rf .next/standalone/.next/static .next/standalone/public
            cp -a .next/static .next/standalone/.next/static
            cp -a public .next/standalone/public
            npm ci
            npx prisma generate
            npx prisma db push
            if PM2_HOME=/home/ubuntu/.pm2 /usr/bin/pm2 describe billiejob >/dev/null 2>&1; then
              PM2_HOME=/home/ubuntu/.pm2 /usr/bin/pm2 delete billiejob
            fi
            DATABASE_URL=file:/var/www/BillieJob/dev.db PM2_HOME=/home/ubuntu/.pm2 /usr/bin/pm2 start .next/standalone/server.js --name billiejob --cwd /var/www/BillieJob --update-env
            PM2_HOME=/home/ubuntu/.pm2 /usr/bin/pm2 save
            sleep 3
            curl -fsS http://127.0.0.1:3000/api/health
